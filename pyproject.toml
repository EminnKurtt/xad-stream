[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xad-stream"
version = "0.1.1"
description = "Explainable anomaly detection on streaming industrial sensor data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy", "pandas", "scikit-learn"]

[project.optional-dependencies]
stream = ["kafka-python==2.3.3"]  # only for the streaming demo (docker compose)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
